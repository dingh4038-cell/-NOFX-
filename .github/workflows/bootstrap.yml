name: Import NOFX source
on:
  push:
    paths: [.github/workflows/bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NoFxAiOS/nofx.git /tmp/nofx-upstream
          rsync -a --delete --exclude '.git' --exclude '.github/workflows/**' /tmp/nofx-upstream/ ./
          python3 - <<'PY'
          from pathlib import Path
          old = "https://www.binance.com/join?ref=NOFXENG"
          new = "https://account.binance.com/register?registerChannel=user_center&ref=1117399867"
          for root in [Path("README.md"), Path("docs"), Path("web/src")]:
              for p in ([root] if root.is_file() else root.rglob("*")):
                  if not p.is_file() or p.suffix.lower() not in {".md",".tsx",".ts",".jsx",".js"}:
                      continue
                  try: s=p.read_text(encoding="utf-8")
                  except UnicodeDecodeError: continue
                  if old in s: p.write_text(s.replace(old,new),encoding="utf-8")
          p=Path("README.md"); s=p.read_text(encoding="utf-8"); m="## Register exchanges"
          d="> **Affiliate disclosure:** The Binance registration link in this distribution is an affiliate link. If you voluntarily register through it and later trade, the distributor may receive a commission from Binance. You may skip it and use an existing account; NOFX never binds a referral relationship automatically.\n\n"
          if m in s and d not in s: p.write_text(s.replace(m,m+"\n\n"+d,1),encoding="utf-8")
          p=Path("docs/i18n/zh-CN/README.md")
          if p.exists():
              s=p.read_text(encoding="utf-8"); m="## 注册交易所"
              d="> **推荐链接披露：** 本发行版中的币安注册链接属于推广链接。用户自愿通过该链接注册并交易后，项目分发者可能从币安获得佣金。用户可以跳过并使用已有账户；NOFX不会自动绑定返佣关系。\n\n"
              if m in s and d not in s: p.write_text(s.replace(m,m+"\n\n"+d,1),encoding="utf-8")
          PY
          printf '%s\n' '# NOFX 中文发行说明' '' '本仓库基于 [NoFxAiOS/nofx](https://github.com/NoFxAiOS/nofx) 开源项目分发，保留原项目 AGPL-3.0 许可证及作者信息。' '' '币安推荐链接：https://account.binance.com/register?registerChannel=user_center&ref=1117399867' '' '该链接属于推广链接。用户自愿通过链接注册并交易后，仓库维护者可能从币安获得佣金。用户可以跳过链接或使用已有账户，系统不会后台自动绑定返佣关系。数字资产和合约交易风险较高，软件不承诺盈利。' > DISTRIBUTION.zh-CN.md
          git config user.name "NOFX Repository Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import NOFX source with disclosed Binance referral"
          git push origin HEAD:main
